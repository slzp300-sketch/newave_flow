spring:
  profiles:
    default: none
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss

jwt:
  secret: ${JWT_SECRET}
  issuer: newave-flow
  accept-legacy-issuer: true
  access-token-expiration: 3600000      # 1시간 (ms)
  refresh-token-expiration: 604800000   # 7일 (ms)

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  review:
    mode: false
    api-url: ${REVIEW_API_URL:}

kakao:
  enabled: ${KAKAO_LOGIN_ENABLED:false}
  client-id: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  admin-key: ${KAKAO_ADMIN_KEY:}
  app-id: ${KAKAO_APP_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:https://newaveflow-production.up.railway.app/api/auth/kakao/callback}
  web-return-uri: ${KAKAO_WEB_RETURN_URI:https://newave-flow.vercel.app/auth/kakao/callback}

apple:
  enabled: ${APPLE_LOGIN_ENABLED:false}
  client-id: ${APPLE_CLIENT_ID:}
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key: ${APPLE_PRIVATE_KEY:}
  token-encryption-key: ${APPLE_TOKEN_ENCRYPTION_KEY:}

logging:
  level:
    root: INFO
    com.newaveflow: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: OFF
    org.springframework.security: INFO

---

spring:
  config:
    activate:
      on-profile: "dev | local"
  datasource:
    url: jdbc:h2:mem:newave_flow;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    com.newaveflow: DEBUG
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET:${random.uuid}${random.uuid}}

---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

logging:
  level:
    root: INFO
    com.newaveflow: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: OFF
    org.springframework.security: WARN

---

# Dedicated synthetic review service: no production database or OAuth credentials.
spring:
  config:
    activate:
      on-profile: review
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:h2:file:${REVIEW_DATA_DIR}/newaveflow-review;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: review
    password: ${REVIEW_DATABASE_PASSWORD}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

jwt:
  secret: ${REVIEW_JWT_SECRET}
  issuer: newave-flow-review
  accept-legacy-issuer: false

app:
  seed:
    enabled: false
  review:
    mode: true
    api-url: ""
    teacher-password: ${REVIEW_TEACHER_PASSWORD}
    admin-password: ${REVIEW_ADMIN_PASSWORD}

kakao:
  enabled: false
  client-id: ""
  client-secret: ""
  admin-key: ""
  app-id: ""

apple:
  enabled: false
  client-id: ""
  team-id: ""
  key-id: ""
  private-key: ""
  token-encryption-key: ""
