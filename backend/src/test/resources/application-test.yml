spring:
  datasource:
    # Each Spring context owns its schema; evicting one must not drop another context's tables.
    url: jdbc:h2:mem:regression-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
jwt:
  secret: ${random.uuid}${random.uuid}
app:
  seed:
    enabled: false
