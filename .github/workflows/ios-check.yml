name: iOS native checks
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/ios-*']
    paths:
      - 'frontend/**'
      - 'tools/ios/**'
      - '.github/workflows/ios-check.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'tools/ios/**'
      - '.github/workflows/ios-check.yml'
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    # Keep simulator checks on the 14 GB standard Intel host; signing still uses Apple Silicon.
    runs-on: macos-15-intel
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Select an installed supported Xcode
        run: python3 tools/ios/select-xcode.py
      - name: Inspect the SDK and select iPhone and iPad simulators
        run: |
          xcodebuild -version
          python3 tools/ios/select-simulator.py --family iphone --env-var IOS_SIMULATOR_ID \
            --report frontend/.verification/ios/iphone-simulator.json
          python3 tools/ios/select-simulator.py --family ipad --env-var IOS_IPAD_SIMULATOR_ID \
            --report frontend/.verification/ios/ipad-simulator.json
      - name: Test release guards with synthetic profiles and app bundles
        run: python3 -B -m unittest discover -s tools/ios -p 'test_*.py'
      - name: Install the locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Web regression tests and iOS native sync
        working-directory: frontend
        run: |
          npm test
          npm run ios:sync
          npm run ios:verify
      - name: Compile the iOS Release app with simulator ad-hoc signing
        working-directory: frontend
        run: |
          set -o pipefail
          mkdir -p .verification/ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .verification/ios/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build 2>&1 | tee .verification/ios/release-build.log
          codesign --verify --deep --strict .verification/ios/DerivedData/Build/Products/Release-iphonesimulator/App.app
          codesign --display --entitlements - .verification/ios/DerivedData/Build/Products/Release-iphonesimulator/App.app \
            > .verification/ios/simulator-entitlements.plist
          python3 ../tools/ios/verify-bundle.py .verification/ios/DerivedData/Build/Products/Release-iphonesimulator/App.app \
            > .verification/ios/bundle-inspection.json
      - name: Test Keychain on the iPhone simulator
        working-directory: frontend
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination "id=$IOS_SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath .verification/ios/DerivedData \
            -resultBundlePath .verification/ios/native-tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES test 2>&1 | tee .verification/ios/native-tests.log
      - name: Prepare the Release login screen verifier
        timeout-minutes: 2
        working-directory: frontend
        run: |
          xcrun swiftc ../tools/ios/check-launch-screen.swift -o .verification/ios/check-launch-screen
          .verification/ios/check-launch-screen --self-test
      - name: Check the Release login screen on iPhone
        timeout-minutes: 9
        working-directory: frontend
        run: |
          python3 ../tools/ios/check-release-launch.py --family iphone --simulator "$IOS_SIMULATOR_ID" \
            --app .verification/ios/DerivedData/Build/Products/Release-iphonesimulator/App.app \
            --checker .verification/ios/check-launch-screen --output .verification/ios
      - name: Check the Release login screen in iPad compatibility mode
        timeout-minutes: 9
        working-directory: frontend
        run: |
          python3 ../tools/ios/check-release-launch.py --family ipad --simulator "$IOS_IPAD_SIMULATOR_ID" \
            --app .verification/ios/DerivedData/Build/Products/Release-iphonesimulator/App.app \
            --checker .verification/ios/check-launch-screen --output .verification/ios
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-verification
          path: |
            frontend/.verification/ios/*.log
            frontend/.verification/ios/*.png
            frontend/.verification/ios/*.plist
            frontend/.verification/ios/*.json
            frontend/.verification/ios/*.xcresult
          if-no-files-found: ignore
          retention-days: 5
