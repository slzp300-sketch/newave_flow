name: Regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test ../tools/backup/retention.test.cjs ../tools/privacy/deletion.test.cjs
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash gradlew build bootReviewJar --no-daemon
      - run: python3 ../tools/review/verify-bundle.py build/libs/*-review.jar
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run android:sync
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash android/gradlew -p android assembleDebug bundleRelease lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-internal-build
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/reports/lint-results-debug.html
          retention-days: 14
  postgres-migration:
    name: postgres-migration (PostgreSQL ${{ matrix.postgresql }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgresql: ['17', '18']
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:${{ matrix.postgresql }}
        env:
          POSTGRES_DB: newave_migration_ci
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: migration-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verification -d newave_migration_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      RUN_POSTGRES_MIGRATION: 'true'
      MIGRATION_SYNTHETIC_FIXTURE: 'true'
      MIGRATION_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/newave_migration_ci
      MIGRATION_TEST_USER: verification
      MIGRATION_TEST_PASSWORD: migration-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: bash gradlew createMigrationBaseline --init-script db/verification/legacy.init.gradle --no-daemon
      - run: bash gradlew test --tests com.newaveflow.PostgresMigrationTest --no-daemon
      - name: Create isolated privacy rehearsal database
        env:
          PGPASSWORD: migration-ci-only
        run: psql -h 127.0.0.1 -U verification -d newave_migration_ci -c 'CREATE DATABASE newave_privacy_ci'
      - name: Create isolated Kakao migration rehearsal database
        env:
          PGPASSWORD: migration-ci-only
        run: psql -h 127.0.0.1 -U verification -d newave_migration_ci -c 'CREATE DATABASE newave_kakao_ci'
      - name: Verify Kakao schema and existing records
        env:
          RUN_KAKAO_MIGRATION: 'true'
          KAKAO_SYNTHETIC_FIXTURE: 'true'
          KAKAO_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/newave_kakao_ci
        run: bash gradlew test --tests com.newaveflow.KakaoMigrationTest --no-daemon
      - name: Verify account deletion and shared records
        env:
          RUN_PRIVACY_TEST: 'true'
          PRIVACY_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/newave_privacy_ci
        run: bash gradlew test --tests com.newaveflow.PrivacyDeletionTest --no-daemon
      - name: Create isolated Apple and deletion-request migration database
        env:
          PGPASSWORD: migration-ci-only
        run: psql -h 127.0.0.1 -U verification -d newave_migration_ci -c 'CREATE DATABASE newave_apple_deletion_ci'
      - name: Verify Apple credentials and deletion-request schema
        env:
          RUN_APPLE_DELETION_MIGRATION: 'true'
          APPLE_DELETION_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/newave_apple_deletion_ci
        run: bash gradlew test --tests com.newaveflow.AppleDeletionMigrationTest --no-daemon
      - name: Create isolated community safety rehearsal database
        env:
          PGPASSWORD: migration-ci-only
        run: psql -h 127.0.0.1 -U verification -d newave_migration_ci -c 'CREATE DATABASE newave_community_ci'
      - name: Verify content reports, agreement schema and retention
        env:
          RUN_COMMUNITY_MIGRATION: 'true'
          COMMUNITY_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/newave_community_ci
        run: bash gradlew test --tests com.newaveflow.CommunitySafetyMigrationTest --no-daemon
      - name: Create isolated TTS configuration rehearsal database
        env:
          PGPASSWORD: migration-ci-only
        run: psql -h 127.0.0.1 -U verification -d newave_migration_ci -c 'CREATE DATABASE newave_tts_links_ci'
      - name: Verify TTS meeting links and historical rules
        env:
          RUN_TTS_LINK_MIGRATION: 'true'
          TTS_LINK_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/newave_tts_links_ci
        run: bash gradlew test --tests com.newaveflow.TtsLinkMigrationTest --no-daemon
      - name: Create isolated TTS manual completion rehearsal database
        env:
          PGPASSWORD: migration-ci-only
        run: psql -h 127.0.0.1 -U verification -d newave_migration_ci -c 'CREATE DATABASE newave_tts_manual_ci'
      - name: Verify manual TTS completion and preserved records
        env:
          RUN_TTS_MANUAL_MIGRATION: 'true'
          TTS_MANUAL_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/newave_tts_manual_ci
        run: bash gradlew test --tests com.newaveflow.TtsManualMigrationTest --no-daemon
